[greeter]
# Quokka OS — LightDM greeter theme
# Colors from branding/palette/palette.md
theme-name = Quokka-Dark
icon-theme-name = Papirus-Dark
font-name = Sans 11
xft-antialias = true
xft-hintstyle = slight

background = /usr/share/backgrounds/quokka/quokka-wallpaper-1920x1080.png
background-color = #000410
default-user-image = /usr/share/plymouth/themes/quokka/logo.png

# Panel styling reuses the same palette so the greeter doesn't feel like
# a different product from the boot splash / desktop that follow it.
indicators = ~host;~spacer;~clock;~spacer;~session;~language;~a11y;~power
clock-format = %H:%M
position = 50%,center 50%,center

hide-user-image = false
show-indicators = ~host;~spacer;~clock;~spacer;~session;~language;~a11y;~power
