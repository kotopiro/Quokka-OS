name: Build Quokka OS ISO

on:
  push:
    branches:
      - main
      - master
    paths:
      - "live-build/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: true
        default: 'standard'
        type: choice
        options:
          - standard
          - full

permissions:
  contents: read

env:
  QUOKKA_PROFILE: ${{ github.event.inputs.profile || 'standard' }}
  HAS_GPG_KEY: ${{ secrets.QUOKKA_GPG_PRIVATE_KEY != '' }}
  HAS_GPG_ID: ${{ secrets.QUOKKA_GPG_KEY_ID != '' }}

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 5120
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build debootstrap squashfs-tools xorriso \
            isolinux syslinux-common grub-pc-bin grub-efi-amd64-bin \
            grub-efi-amd64-signed shim-signed mtools dosfstools \
            wget ca-certificates gnupg curl debian-archive-keyring

      - name: Setup Kali Archive Key
        run: |
          # 1. ホスト環境（GitHub Runner）にKaliの公式リポジトリと鍵を登録して整合性を確保
          wget -q -O - https://archive.kali.org/archive-keyring.gpg | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/kali-archive-keyring.gpg
          echo "deb http://kali.org kali-rolling main contrib non-free non-free-firmware" | sudo tee /etc/apt/sources.list.d/kali.list
          sudo apt-get update
          
          # 2. live-build用のディレクトリを作成
          mkdir -p live-build/config/archives
          
          # 3. live-buildが正しく読み込めるよう、公式のGPG鍵を「ASCIIアームド形式（.asc）」に変換して配置
          curl -s https://archive.kali.org/archive-keyring.gpg | gpg --dearmor | gpg --enarmor > live-build/config/archives/kali.key.chroot
          cp live-build/config/archives/kali.key.chroot live-build/config/archives/kali.key.binary

      - name: lb build
        working-directory: live-build
        shell: bash
        run: |
          # 1. 過去の設定や不正なキャッシュディレクトリのみを個別に物理削除
          sudo rm -rf .build cache config/bootstrap config/chroot config/binary config/rootfs
          sudo rm -f *.iso *.sha256 *.asc *.log
          
          # 2. 正確な auto/config のパスを大文字小文字を無視して自動追跡
          CONFIG_PATH=$(find . -iname "config" | grep -i "auto/config" | head -n 1 || true)
          
          if [ -z "$CONFIG_PATH" ]; then
            echo "Error: auto/config file was not found in $(pwd)"
            echo "=== Directory Contents ==="
            ls -la
            exit 1
          fi
          
          echo "Found auto/config at: $CONFIG_PATH"
          
          # 3. 実行権限を強制付与して設定を確定させる
          chmod +x "$CONFIG_PATH"
          sudo --preserve-env=QUOKKA_PROFILE "$CONFIG_PATH"
          
          # 4. ビルドを実行
          sudo --preserve-env=QUOKKA_PROFILE lb build 2>&1 | tee build.log
          
          if [ ! -f *.iso ]; then
            echo "Error: ISO image was not generated."
            exit 1
          fi

      - name: Post-process and Rename ISO
        working-directory: live-build
        run: |
          DATE=$(date +%Y%m%d)
          for f in *.iso; do
            NEW_NAME="quokka-os-${{ env.QUOKKA_PROFILE }}-${DATE}-amd64.iso"
            mv "$f" "$NEW_NAME"
            echo "ISO_FILENAME=$NEW_NAME" >> $GITHUB_ENV
            break
          done

      - name: Generate checksum
        working-directory: live-build
        run: |
          sha256sum "${{ env.ISO_FILENAME }}" > "${{ env.ISO_FILENAME }}.sha256"

      - name: Import GPG key
        if: success() && env.HAS_GPG_KEY == 'true'
        run: |
          echo "${{ secrets.QUOKKA_GPG_PRIVATE_KEY }}" | base64 -d > /tmp/quokka-private.key
          gpg --batch --import /tmp/quokka-private.key
          rm -f /tmp/quokka-private.key

      - name: Sign checksums
        if: success() && env.HAS_GPG_KEY == 'true' && env.HAS_GPG_ID == 'true'
        working-directory: live-build
        env:
          QUOKKA_GPG_KEY_ID: ${{ secrets.QUOKKA_GPG_KEY_ID }}
          QUOKKA_GPG_PASSPHRASE: ${{ secrets.QUOKKA_GPG_PASSPHRASE }}
        run: |
          if [ -z "$QUOKKA_GPG_PASSPHRASE" ]; then
            gpg --batch --yes --local-user "$QUOKKA_GPG_KEY_ID" --armor --detach-sign "${{ env.ISO_FILENAME }}.sha256"
          else
            echo "$QUOKKA_GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --local-user "$QUOKKA_GPG_KEY_ID" --armor --detach-sign "${{ env.ISO_FILENAME }}.sha256"
          fi

      - name: Upload ISO Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quokka-os-${{ env.QUOKKA_PROFILE }}-iso
          path: |
            live-build/*.iso
            live-build/*.sha256
            live-build/*.sha256.asc
          if-no-files-found: error
          retention-days: 7

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quokka-os-${{ env.QUOKKA_PROFILE }}-build-log
          path: live-build/build.log
          if-no-files-found: ignore
          retention-days: 7
