name: Build Quokka OS ISO

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-latest

    container:
      image: debian:12

    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packages
        run: |
          apt-get update

          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            live-build \
            debootstrap \
            debian-archive-keyring \
            wget \
            curl \
            ca-certificates \
            gnupg \
            xorriso \
            squashfs-tools \
            grub-pc-bin \
            grub-efi-amd64-bin \
            grub-efi-ia32-bin \
            grub-common \
            isolinux \
            syslinux-common \
            dosfstools \
            mtools

      - name: Download Kali key
        run: |
          mkdir -p live-build/config/archives

          if [ ! -f live-build/config/archives/kali.key.chroot ]; then
            wget https://archive.kali.org/archive-key.asc \
              -O live-build/config/archives/kali.key.chroot
          fi

      - name: Clean
        working-directory: live-build
        run: |
          lb clean --purge || true
          rm -rf cache .build chroot binary local

      - name: Configure
        working-directory: live-build
        run: |
          chmod +x auto/config
          ./auto/config

      - name: Show config
        working-directory: live-build
        run: |
          lb config --dump || true

      - name: Build
        working-directory: live-build
        run: |
          lb build 2>&1 | tee build.log

      - name: Show files
        if: always()
        working-directory: live-build
        run: |
          pwd
          ls -lah
          find . -type f

      - name: Create checksum
        if: success()
        working-directory: live-build
        shell: bash
        run: |
          shopt -s nullglob

          files=( *.iso *.hybrid.iso )

          if [ ${#files[@]} -eq 0 ]; then
            echo "ISO not found"
            exit 1
          fi

          for f in "${files[@]}"; do
            sha256sum "$f" > "$f.sha256"
          done

      - name: Upload ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: QuokkaOS-ISO
          path: |
            live-build/*.iso
            live-build/*.sha256

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: live-build/build.log
