name: Build Quokka OS ISO

on:
  push:
    branches:
      - main
      - master
    paths:
      - "live-build/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-common \
            grub-pc-bin \
            grub-efi-amd64-bin \
            grub-efi-amd64-signed \
            shim-signed \
            mtools \
            dosfstools \
            wget \
            curl \
            ca-certificates \
            gnupg

      - name: Fetch Kali archive key
        run: |
          mkdir -p live-build/config/archives
          if [ ! -s live-build/config/archives/kali.key.chroot ]; then
            wget https://archive.kali.org/archive-key.asc \
              -O live-build/config/archives/kali.key.chroot
          fi

      - name: Show repository
        run: |
          pwd
          ls -R live-build

      - name: Clean previous build
        working-directory: live-build
        run: |
          sudo lb clean --purge || true
          sudo rm -rf cache .build chroot binary local

      - name: Configure live-build
        working-directory: live-build
        run: |
          chmod +x auto/config
          sudo ./auto/config
          echo "===== auto/config ====="
          cat auto/config

      - name: Build ISO
        working-directory: live-build
        run: |
          sudo lb build 2>&1 | tee build.log

      - name: Show build output
        if: always()
        working-directory: live-build
        run: |
          echo "===== Files ====="
          ls -lah
          echo
          echo "===== Search ISO ====="
          find . -type f \( -name "*.iso" -o -name "*.img" \)

      - name: Generate SHA256
        if: success()
        working-directory: live-build
        shell: bash
        run: |
          shopt -s nullglob
          files=( *.iso *.hybrid.iso )

          if [ ${#files[@]} -eq 0 ]; then
            echo "ERROR: ISO not found."
            exit 1
          fi

          for f in "${files[@]}"; do
            sha256sum "$f" > "$f.sha256"
          done

      - name: Upload ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quokka-os-iso
          path: |
            live-build/*.iso
            live-build/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quokka-os-build-log
          path: |
            live-build/build.log
          if-no-files-found: ignore
          retention-days: 14
