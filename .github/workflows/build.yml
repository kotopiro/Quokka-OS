name: Build Quokka OS ISO

on:
  push:
    branches:
      - main
      - master
    paths:
      - "live-build/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile
        required: true
        default: standard
        type: choice
        options:
          - standard
          - full

permissions:
  contents: read

env:
  QUOKKA_PROFILE: ${{ inputs.profile || 'standard' }}

jobs:
  build-iso:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-common \
            grub-pc-bin \
            grub-efi-amd64-bin \
            grub-efi-amd64-signed \
            shim-signed \
            mtools \
            dosfstools \
            wget \
            ca-certificates \
            gnupg

      # 【修正1】鍵をバイナリ形式に変換 (dearmor)
      # これをやらないと APT が "unsupported filetype" と言って鍵を無視します
      - name: Fetch Kali archive key
        run: |
          mkdir -p live-build/config/archives
          wget -qO - https://archive.kali.org/archive-key.asc | gpg --dearmor | sudo tee live-build/config/archives/kali.key.chroot > /dev/null

      - name: Show selected profile
        run: echo "QUOKKA_PROFILE=${QUOKKA_PROFILE}"

      - name: Clean previous build
        working-directory: live-build
        run: sudo lb clean --purge

      # 【修正2】lb config を明示的に呼び出し、Ubuntu ミラーの混入を阻止する
      # --parent-mirror-security を Debian のものに固定するのが肝です
      - name: Configure live-build
        working-directory: live-build
        run: |
          chmod +x auto/config
          sudo lb config \
            --mirror-bootstrap "http://deb.debian.org/debian/" \
            --mirror-chroot "http://deb.debian.org/debian/" \
            --parent-mirror-bootstrap "http://deb.debian.org/debian/" \
            --parent-mirror-chroot "http://deb.debian.org/debian/" \
            --parent-mirror-security "http://security.debian.org/debian-security" \
            --security true
          ./auto/config

      # 【修正3】lb build を sudo で実行（環境変数を維持）
      - name: Build ISO
        working-directory: live-build
        run: |
          set -o pipefail
          sudo --preserve-env=QUOKKA_PROFILE lb build 2>&1 | tee build.log

      - name: Show build output
        if: always()
        working-directory: live-build
        run: ls -lah

      - name: Generate checksum
        if: success()
        working-directory: live-build
        shell: bash
        run: |
          shopt -s nullglob
          for f in *.iso *.hybrid.iso live-image-*.iso; do
            sha256sum "$f" > "$f.sha256"
          done

      - name: Import GPG key
        if: success()
        env:
          QUOKKA_GPG_PRIVATE_KEY: ${{ secrets.QUOKKA_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$QUOKKA_GPG_PRIVATE_KEY" ]; then
            echo "No GPG key configured."
            exit 0
          fi
          echo "$QUOKKA_GPG_PRIVATE_KEY" | base64 -d > /tmp/quokka.key
          gpg --batch --import /tmp/quokka.key
          rm -f /tmp/quokka.key

      - name: Sign checksums
        if: success()
        working-directory: live-build
        shell: bash
        env:
          QUOKKA_GPG_KEY_ID: ${{ secrets.QUOKKA_GPG_KEY_ID }}
          QUOKKA_GPG_PASSPHRASE: ${{ secrets.QUOKKA_GPG_PASSPHRASE }}
        run: |
          if [ -z "$QUOKKA_GPG_KEY_ID" ]; then
            echo "Skipping signing."
            exit 0
          fi
          shopt -s nullglob
          for checksum in *.sha256; do
            if [ -n "${QUOKKA_GPG_PASSPHRASE:-}" ]; then
              gpg --batch --yes --pinentry-mode loopback --passphrase "$QUOKKA_GPG_PASSPHRASE" --local-user "$QUOKKA_GPG_KEY_ID" --armor --detach-sign "$checksum"
            else
              gpg --batch --yes --local-user "$QUOKKA_GPG_KEY_ID" --armor --detach-sign "$checksum"
            fi
          done

      - name: Upload ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quokka-os-${{ env.QUOKKA_PROFILE }}-iso
          path: |
            live-build/*.iso
            live-build/*.sha256
            live-build/*.sha256.asc
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quokka-os-${{ env.QUOKKA_PROFILE }}-build-log
          path: live-build/build.log
          if-no-files-found: ignore
          retention-days: 14
